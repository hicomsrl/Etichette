<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheda Tecnica</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); max-width: 400px; margin: auto; }
        img { max-width: 120px; margin-bottom: 15px; }
        h1 { color: #2c3e50; font-size: 22px; margin-bottom: 5px; }
        .info-box { background: #ecf0f1; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: left; }
        .label { font-weight: bold; color: #7f8c8d; font-size: 11px; text-transform: uppercase; display: block; }
        .value { font-size: 17px; color: #34495e; display: block; margin-bottom: 12px; font-weight: bold; border-bottom: 1px solid #dcdde1; padding-bottom: 5px; }
        .value:last-child { border-bottom: none; }
        .btn { display: inline-block; padding: 12px 25px; background: #27ae60; color: white; text-decoration: none; border-radius: 30px; font-weight: bold; margin-top: 10px; }
        .status { color: #7f8c8d; font-style: italic; margin: 20px 0; }
        .status.error { color: #c0392b; font-style: normal; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <img src="logo.jpg" alt="Logo">
        <h1>Scheda Informativa</h1>

        <div id="status" class="status">Caricamento dati…</div>

        <div id="info" class="info-box" style="display:none">
            <span class="label">Ditta</span>
            <span id="ditta" class="value">---</span>

            <span class="label">Ente autorizzante</span>
            <span id="ente" class="value">---</span>

            <span class="label">Comune</span>
            <span id="comune" class="value">---</span>

            <span class="label">Indirizzo</span>
            <span id="indirizzo" class="value">---</span>

            <span class="label">Cellula (ID + Posizione)</span>
            <span id="cellula" class="value">---</span>

            <span class="label">N° autorizzazione</span>
            <span id="protocollo" class="value">---</span>

            <span class="label">Data rilascio</span>
            <span id="rilascio" class="value">---</span>

            <span class="label">Scadenza autorizzazione</span>
            <span id="scadenza" class="value">---</span>
        </div>

        <a href="mailto:autorizzazioni@hi-com.eu" class="btn">Richiedi Assistenza</a>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR29_TOKQ4hOFSq8_cJEfi3spPQyoJGeetOVlTy40dv-uncETN_DfKFY38BMsnBvhcVNx6NVv4vrOZg/pub?output=csv";

        // Parser CSV minimale che gestisce campi quotati e virgole interne.
        function parseCSV(text) {
            const rows = [];
            let row = [], field = '', inQuotes = false, i = 0;
            while (i < text.length) {
                const c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
                        inQuotes = false; i++;
                    } else { field += c; i++; }
                } else {
                    if (c === '"') { inQuotes = true; i++; }
                    else if (c === ',') { row.push(field); field = ''; i++; }
                    else if (c === '\r') { i++; }
                    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; }
                    else { field += c; i++; }
                }
            }
            if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
            return rows;
        }

        function showError(msg) {
            const s = document.getElementById('status');
            s.textContent = msg;
            s.classList.add('error');
        }

        async function load() {
            const id = (new URLSearchParams(window.location.search).get('id') || '').trim();
            if (!id) { showError('Etichetta non valida (ID mancante).'); return; }

            try {
                // Cache-bust: aggira la cache CDN di Google (≈5 min).
                const resp = await fetch(`${CSV_URL}&_=${Date.now()}`, { cache: 'no-store' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const rows = parseCSV(await resp.text());
                const header = rows.shift();
                if (!header) throw new Error('Sheet vuoto.');

                const col = Object.fromEntries(header.map((h, i) => [h.trim(), i]));
                if (col['QRID'] === undefined) throw new Error('Colonna QRID assente.');

                const record = rows.find(r => (r[col['QRID']] || '').trim() === id);
                if (!record) { showError(`Etichetta "${id}" non trovata.`); return; }

                const get = (name) => {
                    const i = col[name];
                    return i !== undefined && record[i] ? record[i].trim() : '---';
                };

                document.getElementById('ditta').textContent = get('Ditta');
                document.getElementById('ente').textContent = get('Ente');
                document.getElementById('comune').textContent = get('Comune');
                document.getElementById('indirizzo').textContent = get('Descrizione');
                document.getElementById('cellula').textContent = `${get('CellulaID')} - ${get('Posizione')}`;
                document.getElementById('protocollo').textContent = get('ProtocolloEnte');
                document.getElementById('rilascio').textContent = get('DataRilascio');
                document.getElementById('scadenza').textContent = get('DataScadenza');

                document.getElementById('status').style.display = 'none';
                document.getElementById('info').style.display = '';
            } catch (err) {
                showError(`Errore caricamento dati: ${err.message}`);
            }
        }
        load();
    </script>
</body>
</html>
